<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playtest Studio</title>
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2'%3E%3Crect x='2' y='6' width='20' height='12' rx='3'/%3E%3Cpath d='M6 12h4m-2-2v4'/%3E%3Ccircle cx='15' cy='11' r='1' fill='%236366f1'/%3E%3Ccircle cx='17' cy='13' r='1' fill='%236366f1'/%3E%3C/svg%3E"
  />
</head>
<body class="studio-container studio-mode-full">
  <div id="app" class="studio-container studio-mode-full">
    <div id="app-root" class="studio-container studio-mode-full">
      <!-- Top Header Bar -->
      <header id="header-bar" class="playtest-header"></header>

      <!-- Contextual Pause & DVR Annotation Bar (visible when Paused) -->
      <div id="annotation-bar" class="annotation-bar hidden"></div>

      <!-- Center Game & QA Viewport -->
      <main id="viewport-container" class="viewport-container"></main>

      <!-- Bottom Visual Bug Report Bar -->
      <footer id="bug-report-bar" class="bug-report-bar"></footer>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
