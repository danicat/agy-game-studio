<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="bgLight" x1="8" y1="8" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="padBody" x1="24" y1="48" x2="104" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="48" y1="12" x2="80" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
  </defs>

  <!-- Light rounded-square badge with crisp indigo border for light and dark UIs -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgLight)" stroke="#6366F1" stroke-width="5"/>

  <!-- AI sparkle above controller -->
  <path d="M64 12 L69 23 L80 28 L69 33 L64 44 L59 33 L48 28 L59 23 Z"
        fill="url(#sparkGrad)" stroke="#EA580C" stroke-width="2" stroke-linejoin="round"/>

  <!-- Soft drop shadow under gamepad -->
  <path d="M36 56 H92 C101 56 107 63 105 73 L99 96 C97 103.6 89 107 82.4 103 L73 96 H55 L45.6 103 C39 107 31 103.6 29 96 L23 73 C21 63 27 56 36 56 Z"
        fill="#A5B4FC" opacity="0.6"/>

  <!-- High-contrast light gamepad with bold indigo outline -->
  <path d="M36 50 H92 C101 50 107 57 105 67 L99 90 C97 97.6 89 101 82.4 97 L73 90 H55 L45.6 97 C39 101 31 97.6 29 90 L23 67 C21 57 27 50 36 50 Z"
        fill="url(#padBody)" stroke="#1E1B4B" stroke-width="6.8" stroke-linejoin="round"/>

  <!-- Bold D-Pad (Left) -->
  <path d="M41 60 H49 V68 H57 V76 H49 V84 H41 V76 H33 V68 H41 V60 Z"
        fill="#1D4ED8"/>

  <!-- Vivid Action Buttons (Right) -->
  <circle cx="88" cy="66" r="7" fill="#EF4444"/>
  <circle cx="76" cy="79" r="7" fill="#10B981"/>
</svg>
